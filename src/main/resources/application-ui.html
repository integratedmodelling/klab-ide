<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<style>
body{font:14px system-ui,sans-serif;margin:0;color:#253344;background:#fafbfc}
#status{padding:8px;color:#556;white-space:pre-wrap}main{padding:16px}
.node{box-sizing:border-box;min-width:0;margin:4px 0}.node>label{display:block;margin-bottom:4px}
button,input,select,textarea{font:inherit;padding:8px;border:1px solid #abb8c4;border-radius:4px}
button{background:#edf4fc;cursor:pointer}button:disabled{cursor:default;opacity:.5}
[data-theme=dark]{background:#202630;color:#edf3fa}fieldset{border:1px solid #aab6c3;border-radius:6px}
.unsupported{padding:8px;border:1px solid #ba7100;color:#925600}
</style></head><body><div id="status" role="status">Run the published application to display its interface.</div><main id="app"></main>
<script>
'use strict';
let online=false,pending=false,supported=true,sequence=0,revision=0,queue=[];
const app=document.getElementById('app'),status=document.getElementById('status');
function disconnected(){online=false;pending=false;queue=[];app.querySelectorAll('input,button,select,textarea').forEach(e=>e.disabled=true);}
function receive(frame){
  try{
    if(frame.type==='instance'){
      const i=frame.value;
      supported=!i.toolkit || (i.toolkit.protocolVersion===1 && i.toolkit.id==='quasar');
      if(!supported)
        throw Error('This application requires a custom web toolkit. Open it in the runtime web interface.');
      document.querySelectorAll('.project-style').forEach(e=>e.remove());
      Object.values(i.stylesheets||{}).forEach(css=>{const s=document.createElement('style');s.className='project-style';s.textContent=css;document.head.appendChild(s);});
      if(i.state.snapshot)render(i.state.snapshot);
    }else if(frame.type==='snapshot'){if(supported)render(frame.value);}
    else if(frame.type==='ready'){
      if(!supported)return;
      sequence=frame.value.lastAcceptedSequence;online=true;status.textContent='Connected';
      app.querySelectorAll('[data-blocked]').forEach(e=>e.disabled=e.dataset.blocked==='true');
    }else if(frame.type==='ack'){sequence=Math.max(sequence,frame.value);pending=false;drain();}
    else if(frame.type==='resync'){
      queue=[];pending=false;sequence=frame.value.lastAcceptedSequence;
      if(frame.value.snapshot)render(frame.value.snapshot);
      status.textContent='The interface changed. Please repeat the last action.';
    }else if(frame.type==='error'){queue=[];pending=false;status.textContent=String(frame.value);}
    else if(frame.type==='disconnected'){disconnected();status.textContent='Disconnected';}
    else if(frame.type==='stopped'){disconnected();app.replaceChildren();status.textContent='Application stopped';}
  }catch(error){disconnected();status.textContent=error.message;}
}
function send(node,name,value){
  if(!online || !(node.events||[]).includes(name))return;
  if(queue.length>=16){status.textContent='Too many pending actions';return;}
  queue.push({nodeId:node.id,name,value});drain();
}
function drain(){
  if(pending || !online || !queue.length)return;
  pending=true;
  window.ide.input(JSON.stringify({type:'input',value:{...queue.shift(),sequence:++sequence,revision}}));
}
function render(snapshot){
  if(snapshot.protocolVersion!==1)throw Error('Unsupported application UI protocol');
  revision=snapshot.revision;
  const active=document.activeElement,id=active && active.dataset.nodeId;
  const start=active && active.selectionStart,end=active && active.selectionEnd;
  app.dataset.theme=snapshot.root.properties.theme||'light';
  app.lang=snapshot.root.properties.locale||'en';
  app.replaceChildren(nodeView(snapshot.root,false));
  if(id){const element=Array.from(app.querySelectorAll('[data-node-id]')).find(e=>e.dataset.nodeId===id);
    if(element){element.focus();if(typeof element.setSelectionRange==='function' && start!==null)
      try{element.setSelectionRange(start,end);}catch{}}}
}
function nodeView(node,parentBlocked){
  const p=node.properties||{},box=document.createElement('div');box.className='node';
  if(p.hidden){box.hidden=true;return box;}
  if(p.invisible)box.style.visibility='hidden';
  const blocked=parentBlocked || !!(p.disabled||p.readonly||p.loading||p.invisible);
  const lengths={width:'width',height:'height',minwidth:'minWidth',maxwidth:'maxWidth',minheight:'minHeight',maxheight:'maxHeight',gap:'gap',rowgap:'rowGap',columngap:'columnGap',basis:'flexBasis',fontsize:'fontSize',radius:'borderRadius',padding:'padding',margin:'margin'};
  Object.entries(lengths).forEach(([key,css])=>{if(p[key]!=null)box.style[css]=typeof p[key]==='number'?p[key]+'px':String(p[key]);});
  if(p.layout){box.style.display='flex';box.style.flexDirection=p.layout+(p.direction==='reverse'?'-reverse':'');}
  const aliases={grow:'flexGrow',shrink:'flexShrink',order:'order',wrap:'flexWrap',justify:'justifyContent',align:'alignItems',self:'alignSelf',overflow:'overflow'};
  Object.entries(aliases).forEach(([key,css])=>{if(p[key]!=null)box.style[css]=p[key]==='start'?'flex-start':p[key]==='end'?'flex-end':p[key];});
  if(p.fill){box.style.flexGrow=p.grow??1;box.style.alignSelf=p.self??'stretch';}
  if(p.tooltip)box.title=String(p.tooltip);
  if(p.title){const title=document.createElement('h2');title.textContent=String(p.title);box.append(title);}
  let control;
  if(node.type==='text'){const text=document.createElement('span');text.textContent=p.label??'';box.append(text);}
  else if(node.type==='button'){
    control=document.createElement('button');control.textContent=p.label??'';control.onclick=()=>send(node,'click',null);
  }else if(['input','number','checkbox','select'].includes(node.type)){
    const label=document.createElement('label');label.textContent=p.label??'';label.htmlFor='node-'+node.id;box.append(label);
    if(node.type==='select'){
      control=document.createElement('select');
      (p.options||[]).forEach((option,index)=>{const entry=document.createElement('option');entry.value=String(index);entry.textContent=typeof option==='object'?(option.label??option.value):String(option);entry.selected=JSON.stringify(option)===JSON.stringify(p.value);control.append(entry);});
      control.onchange=()=>send(node,'change',(p.options||[])[Number(control.value)]);
    }else{
      control=document.createElement('input');control.type=node.type==='checkbox'?'checkbox':node.type==='number'?'number':['text','password','email','url','tel','search'].includes(p.type)?p.type:'text';
      control.value=p.value??'';control.checked=!!p.value;control.placeholder=p.placeholder??'';
      ['min','max','step','maxlength'].forEach(key=>{if(p[key]!=null)control.setAttribute(key,p[key]);});
      control.onchange=()=>send(node,'change',node.type==='checkbox'?control.checked:node.type==='number'?Number(control.value):control.value);
    }
  }else if(node.type==='progress'){
    control=document.createElement('progress');control.max=1;if(!p.indeterminate)control.value=Number(p.value||0);
  }else if(['dialog','modal'].includes(node.type)){
    box.setAttribute('role','dialog');
    if(p.dismissible!==false && node.type!=='modal'){const close=document.createElement('button');close.textContent='Close';close.disabled=blocked||!online;close.dataset.blocked=String(blocked);close.onclick=()=>send(node,'close',null);box.append(close);}
  }else if(!['application','view','container','group','panel','header','footer','drawer','window','toolbar','menu','notification','layout','row','column'].includes(node.type)){
    const warning=document.createElement('p');warning.className='unsupported';warning.textContent='Widget "'+node.type+'" requires the runtime web interface.';box.append(warning);
  }
  if(control){control.id='node-'+node.id;control.dataset.nodeId=node.id;control.dataset.blocked=String(blocked);control.disabled=blocked||!online;control.setAttribute('aria-label',p.label||p.title||node.type);box.append(control);}
  (node.children||[]).forEach(child=>box.append(nodeView(child,blocked)));
  return box;
}
</script></body></html>
