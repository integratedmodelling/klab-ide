# Conveyor packaging configuration for k.LAB Modeler
# See: https://www.hydraulic.dev/docs/
# Add env vars: CONVEYOR_AGREE_TO_LICENSE=1 and PROJECT_VERSION="1.0" before running

include required("/stdlib/jdk/21/openjdk.conf")
include required("/stdlib/jvm/javafx/from-jmods.conf")
javafx.version = "21.0.6"

app {
  fsname = "klab-ide"
  long-fsname = "klab-ide"
  product-name = "k.LAB Modeler"
  display-name = "k.LAB Modeler"
  vendor = "Integrated Modelling Partnership"
  version = "1.0"
  revision = "3"
  id = "org.integratedmodelling.klab.ide"
  rdns-name = "org.integratedmodelling.klab.ide"
  summary = "Integrated modelling IDE for the k.LAB platform"
  description = "A JavaFX-based IDE for knowledge-based modelling with k.LAB."
  updates = aggressive
  vcs-url = "https://github.com/integratedmodelling/klab-ide"
  license = "AGPL-3.0-or-later"
  signing-key = "enough panic six festival rely race offer fly detect wide network ivory play exchange dog category aim smile load smooth hold isolate horse drip/2026-01-16T10:32:09Z"

  jvm {
    gui.main-class = org.integratedmodelling.klab.ide.KlabIDEApplication
  }

  windows.amd64.inputs = [
     "target/klab-ide-all-1.0.0-SNAPSHOT.jar"
  ]

  linux.amd64.glibc.inputs = [
     "target/klab-ide-all-1.0.0-SNAPSHOT.jar"
  ]

  mac.amd64.inputs = [
     "target/klab-ide-all-1.0.0-SNAPSHOT.jar"
  ]

  mac.aarch64.inputs = [
     "target/klab-ide-all-1.0.0-SNAPSHOT.jar"
  ]

  site {
    base-url = "https://products.integratedmodelling.org/klab-ide/develop"
    icons = "src/main/resources/package/images/klab-ide.svg"
  }

  # Icons per platform
  icons {
    windows = "src/main/resources/package/windows/klab.ico"
    mac = "src/main/resources/package/macosx/klab.icns"
    linux = "src/main/resources/package/images/klab-ide.svg"
  }

  jvm {
    # Minimum Java runtime version
    minVersion = "21"
    mainClass = "org.integratedmodelling.klab.ide.KlabIDEApplication"
    # Classpath built by Maven profile (classes + copied runtime deps)
    classpath = [
      "target/classes",
      "target/dependency/*"
    ]
    # Ensure JavaFX modules are loaded when using classpath
    jvmArgs = [
      "--add-modules=javafx.controls,javafx.fxml,javafx.web,javafx.media,javafx.graphics,javafx.swing"
    ]

    modules = [
      # Standard modules that might not be auto-detected
      jdk.charsets,
      jdk.crypto.ec,
      jdk.localedata,
      java.net.http,
      java.logging,
      java.desktop,
      java.xml,
      java.scripting,
      jdk.jsobject,
      jdk.unsupported,
      jdk.unsupported.desktop,
      jdk.management,

      # JavaFX modules
      javafx.controls,
      javafx.fxml,
      javafx.graphics,
      javafx.media,
      javafx.swing,
      javafx.web
    ]
  }

  # Platform-specific options
  windows {
    # Disable code signing by default (enable in CI by providing certificates)
    signing.enabled = false
    companyName = "Integrated Modelling Partnership"
    appUserModelId = "org.integratedmodelling.klab.ide"
  }

  mac {
    signing.enabled = false
    bundleId = "org.integratedmodelling.klab.ide"
  }

  linux {
    category = "Development"
  }

  # Build for the three main architectures
  machines = ["windows.amd64", "linux.amd64.glibc", "mac.amd64", "mac.aarch64"]
}

conveyor.compatibility-level = 21

conveyor.billing-email = "admin@integratedmodelling.org"
